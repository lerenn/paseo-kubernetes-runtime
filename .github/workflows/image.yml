name: image
# Builds the default pod image and publishes it to ghcr. Pin the digest it prints in the plugin's Image setting.
# On main it also copies each image, by digest and with the same sha-<commit> tag, to the lab ECR when the
# repository variable LAB_ECR_PUSH_ROLE_ARN is set (docs/ecr-push.md).
# Runner: self-hosted ci-1 when the repository variable USE_SELF_HOSTED is 'true', GitHub-hosted otherwise
# (the failover; also the default until a runner is registered for this repository).
on:
  push:
    branches: [main]
    paths: ["image/**", ".github/workflows/image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
env:
  IMAGE: ghcr.io/lerenn/paseo-kubernetes-runtime-default
  GO_IMAGE: ghcr.io/lerenn/paseo-kubernetes-runtime-go
  ECR_REGISTRY: 824843843469.dkr.ecr.eu-west-3.amazonaws.com
  ECR_REGION: eu-west-3
jobs:
  image:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","x64","docker"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: image
          load: true
          tags: ${{ env.IMAGE }}:test
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Check the tools the runtime needs
        run: |
          docker run --rm ${{ env.IMAGE }}:test sh -c 'id -u && node --version && git --version && gh --version | head -1 && jq --version && rg --version | head -1 && kubectl version --client && claude --version && codex --version'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        id: push
        uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Digest
        run: echo "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: AWS credentials (lab ECR)
        if: github.ref == 'refs/heads/main' && vars.LAB_ECR_PUSH_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LAB_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.ECR_REGION }}
      - name: Log in to the lab ECR
        if: github.ref == 'refs/heads/main' && vars.LAB_ECR_PUSH_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2
      - name: Copy to the lab ECR
        if: github.ref == 'refs/heads/main' && vars.LAB_ECR_PUSH_ROLE_ARN != ''
        run: |
          docker buildx imagetools create \
            --tag "${{ env.ECR_REGISTRY }}/lab/paseo-agent-default:sha-${{ github.sha }}" \
            "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
          echo "${{ env.ECR_REGISTRY }}/lab/paseo-agent-default:sha-${{ github.sha }} (from ${{ steps.push.outputs.digest }})" | tee -a "$GITHUB_STEP_SUMMARY"
  image-go:
    # The default image plus Go 1.25 (profile prbr-picky). Built from the default image just published.
    needs: image
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","x64","docker"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: image/go
          load: true
          build-args: BASE=${{ env.IMAGE }}:sha-${{ github.sha }}
          tags: ${{ env.GO_IMAGE }}:test
      - name: Check the tools the profile needs
        run: |
          docker run --rm ${{ env.GO_IMAGE }}:test sh -c 'id -u && go version | grep -q "go1.25" && git --version && python3 --version && jq --version && claude --version'
      - name: Publish
        id: push
        uses: docker/build-push-action@v6
        with:
          context: image/go
          push: true
          build-args: BASE=${{ env.IMAGE }}:sha-${{ github.sha }}
          tags: |
            ${{ env.GO_IMAGE }}:latest
            ${{ env.GO_IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Digest
        run: echo "${{ env.GO_IMAGE }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: AWS credentials (lab ECR)
        if: github.ref == 'refs/heads/main' && vars.LAB_ECR_PUSH_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LAB_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.ECR_REGION }}
      - name: Log in to the lab ECR
        if: github.ref == 'refs/heads/main' && vars.LAB_ECR_PUSH_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2
      - name: Copy to the lab ECR
        if: github.ref == 'refs/heads/main' && vars.LAB_ECR_PUSH_ROLE_ARN != ''
        run: |
          docker buildx imagetools create \
            --tag "${{ env.ECR_REGISTRY }}/lab/paseo-agent-go:sha-${{ github.sha }}" \
            "${{ env.GO_IMAGE }}@${{ steps.push.outputs.digest }}"
          echo "${{ env.ECR_REGISTRY }}/lab/paseo-agent-go:sha-${{ github.sha }} (from ${{ steps.push.outputs.digest }})" | tee -a "$GITHUB_STEP_SUMMARY"
