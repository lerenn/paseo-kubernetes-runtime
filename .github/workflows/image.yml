name: image
# Builds the default pod image and publishes it to ghcr. Pin the digest it prints in the plugin's Image setting.
on:
  push:
    branches: [main]
    paths: ["image/**", ".github/workflows/image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/lerenn/paseo-kubernetes-runtime-default
  GO_IMAGE: ghcr.io/lerenn/paseo-kubernetes-runtime-go
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: image
          load: true
          tags: ${{ env.IMAGE }}:test
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Check the tools the runtime needs
        run: |
          docker run --rm ${{ env.IMAGE }}:test sh -c 'id -u && node --version && git --version && gh --version | head -1 && jq --version && rg --version | head -1 && claude --version && codex --version'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        id: push
        uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Digest
        run: echo "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
  image-go:
    # The default image plus Go 1.25 (profile prbr-picky). Built from the default image just published.
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: image/go
          load: true
          build-args: BASE=${{ env.IMAGE }}:sha-${{ github.sha }}
          tags: ${{ env.GO_IMAGE }}:test
      - name: Check the tools the profile needs
        run: |
          docker run --rm ${{ env.GO_IMAGE }}:test sh -c 'id -u && go version | grep -q "go1.25" && git --version && python3 --version && jq --version && claude --version'
      - name: Publish
        id: push
        uses: docker/build-push-action@v6
        with:
          context: image/go
          push: true
          build-args: BASE=${{ env.IMAGE }}:sha-${{ github.sha }}
          tags: |
            ${{ env.GO_IMAGE }}:latest
            ${{ env.GO_IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Digest
        run: echo "${{ env.GO_IMAGE }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
